<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
<title>Switch Master</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rotateWarning">
  <h2>🔄 Lütfen Telefonunu Yan Çevir</h2>
  <p>Switch Master yatay ekranda oynanmak üzere tasarlandı.</p>
</div>

<div id="gameWrapper">
  <button id="fullscreenBtn" onclick="toggleFullScreen()">⛶</button>

  <div id="leaderboardUI">
    <h3>EN İYİ 5!</h3>
    <ol id="scoreList">Yükleniyor...</ol>
  </div>

  <div id="startScreen" class="ui-screen">
    <div class="modal-box start">
      <h2>🚂 Switch Master</h2>
      <p>Rayları değiştir, treni kurtar!</p>
      <button onclick="startGame()">OYUNA BAŞLA</button>
    </div>
  </div>

  <div id="gameOverScreen" class="ui-screen hidden">
    <div class="modal-box">
      <h2>KAZA!</h2>
      <p id="finalScoreDisplay">Skor: 0</p>
      
      <div id="scoreInputArea" class="hidden">
        <input type="text" id="playerNameInput" placeholder="İsmini gir..." maxlength="12" autocomplete="off" />
        <br>
        <button onclick="submitScoreAndRestart()">Kaydet & Tekrar Oyna</button>
      </div>

      <button id="justRestartBtn" onclick="restartGame()">Tekrar Oyna</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
