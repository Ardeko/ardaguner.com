<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
<title>Switch Master</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    touch-action: none; /* Mobilde kaydırmayı engeller */
  }

  #gameWrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* HTML ARAYÜZLERİ */
  .ui-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }

  .modal-box {
    background: #222;
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    color: white;
    width: 80%;
    max-width: 400px;
  }

  .modal-box h2 {
    margin-top: 0;
    color: #ff4444;
    font-size: 32px;
    text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
  }

  .modal-box.start h2 { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
  .modal-box p { font-size: 18px; margin-bottom: 20px; }

  input[type="text"] {
    width: 80%;
    padding: 10px;
    margin-bottom: 15px;
    background: #111;
    border: 1px solid #555;
    color: #00ff88;
    font-size: 16px;
    border-radius: 6px;
    text-align: center;
    outline: none;
  }

  button {
    background: #00ff88;
    color: #000;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    margin: 5px;
  }

  button:hover { background: #00cc6a; transform: scale(1.05); }

  /* LEADERBOARD (Mobilde biraz küçültüldü) */
  #leaderboardUI {
    position: absolute; 
    top: 10px; 
    right: 10px; 
    background: rgba(34, 34, 34, 0.9); 
    border: 2px solid #00ccff; 
    color: white; 
    padding: 10px 15px; 
    border-radius: 8px;
    z-index: 50;
    pointer-events: none; /* Oyuncunun tıklamasını engellememesi için */
  }
  #leaderboardUI h3 { margin-top: 0; margin-bottom: 5px; color: #00ccff; text-align: center; font-size: 16px;}
  #scoreList { padding-left: 15px; margin-bottom: 0; font-size: 14px;}

  /* TAM EKRAN BUTONU (Mobiller için) */
  #fullscreenBtn {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0, 255, 136, 0.7);
    border: none;
    border-radius: 5px;
    color: black;
    font-size: 20px;
    padding: 5px 10px;
    cursor: pointer;
    z-index: 50;
  }

  /* TELEFONU YAN ÇEVİR UYARISI */
  #rotateWarning {
    display: none;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
    z-index: 9999;
  }
  #rotateWarning h2 { color: #ffeb3b; }

  /* EĞER EKRAN DİK (PORTRAIT) İSE OYUNU GİZLE, UYARIYI GÖSTER */
  @media screen and (orientation: portrait) {
    #gameWrapper { display: none !important; }
    #rotateWarning {
      display: flex !important;
      position: absolute; top:0; left:0; width:100%; height:100%;
      flex-direction: column; justify-content: center; align-items: center;
    }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="rotateWarning">
  <h2>🔄 Lütfen Telefonunu Yan Çevir</h2>
  <p>Switch Master yatay ekranda oynanmak üzere tasarlandı.</p>
</div>

<div id="gameWrapper">
  <button id="fullscreenBtn" onclick="toggleFullScreen()">⛶</button>

  <div id="leaderboardUI">
    <h3>Top 5 Masters</h3>
    <ol id="scoreList">Yükleniyor...</ol>
  </div>

  <div id="startScreen" class="ui-screen">
    <div class="modal-box start">
      <h2>🚂 Switch Master</h2>
      <p>Rayları değiştir, treni kurtar!</p>
      <button onclick="startGame()">OYUNA BAŞLA</button>
    </div>
  </div>

  <div id="gameOverScreen" class="ui-screen hidden">
    <div class="modal-box">
      <h2>CRASH!</h2>
      <p id="finalScoreDisplay">Score: 0</p>
      
      <div id="scoreInputArea" class="hidden">
        <input type="text" id="playerNameInput" placeholder="İsmini gir..." maxlength="12" autocomplete="off" />
        <br>
        <button onclick="submitScoreAndRestart()">Kaydet & Tekrar Oyna</button>
      </div>

      <button id="justRestartBtn" onclick="restartGame()">Tekrar Oyna</button>
    </div>
  </div>
</div>

<script>
// --- TAM EKRAN (FULLSCREEN) YÖNETİMİ ---
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.log("Tam ekran hatası:", err.message);
    });
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

// "F" Tuşu desteği hala bilgisayarlar için kalsın
document.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") toggleFullScreen();
});

// --- KODLA ÜRETİLEN RETRO SES EFEKTLERİ ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;

  if (type === 'switch') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.setValueAtTime(800, now + 0.1);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'coin') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.setValueAtTime(1600, now + 0.1);
    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  }
}

// --- FIREBASE & LEADERBOARD ---
const FIREBASE_URL = "https://switch-master-687ff-default-rtdb.europe-west1.firebasedatabase.app/scores.json";

function loadScores() {
  document.getElementById("scoreList").innerHTML = "Yükleniyor...";
  fetch(FIREBASE_URL)
    .then(res => res.json())
    .then(data => {
      if (!data) {
        document.getElementById("scoreList").innerHTML = "Henüz skor yok!";
        return;
      }
      let scoresArray = Object.values(data);
      scoresArray.sort((a, b) => b.score - a.score);
      let top5 = scoresArray.slice(0, 5);
      
      let listHTML = "";
      top5.forEach(entry => {
        listHTML += `<li><b>${entry.name}</b>: ${entry.score}</li>`;
      });
      document.getElementById("scoreList").innerHTML = listHTML;
    }).catch(err => console.error(err));
}

loadScores();

function submitScoreAndRestart() {
  const name = document.getElementById("playerNameInput").value.trim();
  if (name !== "") {
    fetch(FIREBASE_URL, {
      method: "POST",
      body: JSON.stringify({ name: name, score: score })
    }).then(() => {
      loadScores();
      restartGame();
    }).catch(err => console.error(err));
  } else {
    restartGame();
  }
}

// --- PHASER OYUN KODLARI ---
const config = {
  type: Phaser.AUTO,
  width: 800, 
  height: 600, 
  backgroundColor: "#87CEEB", 
  parent: 'gameWrapper', 
  scene: { create, update },
  scale: {
    mode: Phaser.Scale.FIT, 
    autoCenter: Phaser.Scale.CENTER_BOTH 
  }
};

const game = new Phaser.Game(config);

let train, graphics, scoreText;
let switchLever, headlight, coin;
let currentPath, pathIndex = 0;
let baseSpeed = 2.5;
let speed = baseSpeed;
let maxSpeed = 10;
let switchState = "A";
let correctPath = "A";
let lockedChoice = null;

let score = 0;
let isGameOver = false;
let gameStarted = false;
let pulse = 0;
let smokeParticles = [];
let sparkParticles = [];
let currentAngle = 0;

const pathA = [ {x:100,y:300},{x:300,y:300},{x:500,y:200},{x:700,y:200} ];
const pathB = [ {x:100,y:300},{x:300,y:300},{x:500,y:400},{x:700,y:400} ];

let gameScene; 

function create(){
  gameScene = this;
  graphics = this.add.graphics();
  
  coin = this.add.container(0, 0);
  let coinBody = this.add.circle(0, 0, 12, 0xffd700);
  let coinBorder = this.add.circle(0, 0, 12).setStrokeStyle(2, 0xb8860b);
  let coinText = this.add.text(-5, -8, "$", {fontSize: '16px', color: '#000', fontStyle: 'bold'});
  coin.add([coinBody, coinBorder, coinText]);
  coin.setVisible(false);

  train = this.add.container(100,300);

  headlight = this.add.graphics();
  headlight.fillStyle(0xffffff, 0.15);
  headlight.fillTriangle(10, 0, 250, -80, 250, 80);
  headlight.setVisible(false);

  let body = this.add.rectangle(0,0,60,24,0x2e7d32);
  let cabin = this.add.rectangle(10,-14,22,16,0x388e3c);
  let window = this.add.rectangle(10,-14,10,8,0xb3e5fc);
  let front = this.add.rectangle(-25,0,10,18,0x1b5e20);
  let bumper = this.add.rectangle(-30,0,6,10,0xd32f2f);
  let chimney = this.add.rectangle(-10,-18,8,10,0x424242);

  train.add([headlight, body,cabin,window,front,bumper,chimney]);

  scoreText = this.add.text(20,20,"Score: 0",{fontSize:"26px",fill:"#fff", fontStyle:"bold", stroke: '#000', strokeThickness: 4});

  switchLever = this.add.rectangle(300,280,10,40,0xaaaaaa);

  // DOKUNMATİK VE TIKLAMA OLAYI
  this.input.on("pointerdown", ()=>{
    if(!gameStarted || isGameOver) return; 

    playSound('switch');
    spawnSparks(); 
    this.cameras.main.shake(100, 0.005); 

    switchState = switchState==="A"?"B":"A";

    this.tweens.add({
      targets:switchLever,
      scaleY:0.6,
      duration:60,
      yoyo:true
    });
  });

  currentPath = pathA;
}

function update(){
  if(!gameStarted || isGameOver) return;

  pulse += 0.05;
  
  if(score < 5) {
      gameScene.cameras.main.setBackgroundColor('#87CEEB'); 
      headlight.setVisible(false);
  } else if (score < 10) {
      gameScene.cameras.main.setBackgroundColor('#fc7b03'); 
      headlight.setVisible(false);
  } else {
      gameScene.cameras.main.setBackgroundColor('#111122'); 
      headlight.setVisible(true); 
  }

  if(coin.visible) {
    coin.scale = 1 + Math.sin(pulse * 4) * 0.1; 
    let cx = coin.x - train.x;
    let cy = coin.y - train.y;
    if(Math.sqrt(cx*cx + cy*cy) < 25) { 
        coin.setVisible(false);
        score += 3; 
        scoreText.setText("Score: " + score);
        playSound('coin');
        
        gameScene.tweens.add({
            targets: scoreText,
            scale: 1.5,
            duration: 100,
            yoyo: true
        });
    }
  }

  drawRails();
  updateSmoke();
  updateSparks();

  let target = currentPath[pathIndex];
  let dx = target.x - train.x;
  let dy = target.y - train.y;
  let dist = Math.sqrt(dx*dx + dy*dy);
  let step = Math.min(speed, dist);

  if(dist <= step){
    train.x = target.x;
    train.y = target.y;
    pathIndex++;

    if(pathIndex === 2){
      lockedChoice = switchState;
      currentPath = lockedChoice === "A" ? pathA : pathB;
    }

    if(pathIndex >= currentPath.length){
      if(lockedChoice !== correctPath){
        triggerGameOver();
      } else {
        score++;
        scoreText.setText("Score: " + score);
        playSound('score'); 

        speed += 0.3;
        if(speed > maxSpeed) speed = maxSpeed;

        resetTrain();
        setNewCorrectPath();
        
        if(Math.random() > 0.6) {
            let activePath = correctPath === "A" ? pathA : pathB;
            coin.x = activePath[2].x;
            coin.y = activePath[2].y;
            coin.setVisible(true);
        } else {
            coin.setVisible(false);
        }
      }
    }
  } else {
    train.x += (dx/dist) * step;
    train.y += (dy/dist) * step;

    let targetAngle = Math.atan2(dy, dx);
    currentAngle += (targetAngle - currentAngle) * 0.15;
    train.rotation = currentAngle;

    spawnSmoke();
  }
}

// GÖRSEL EFEKTLER (Değişmedi)
function spawnSmoke(){ if(Math.random() > 0.5) return; smokeParticles.push({ x: train.x - 10, y: train.y - 20, alpha: 1, size: Phaser.Math.Between(4,8) }); }
function updateSmoke(){ for(let i=smokeParticles.length-1;i>=0;i--){ let p = smokeParticles[i]; p.y -= 0.5; p.alpha -= 0.015; graphics.fillStyle(0xdddddd, p.alpha); graphics.fillCircle(p.x,p.y,p.size); if(p.alpha<=0) smokeParticles.splice(i,1); } }
function spawnSparks() { for(let i=0; i<8; i++) { sparkParticles.push({ x: train.x, y: train.y + 10, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 1.0 }); } }
function updateSparks() { for(let i=sparkParticles.length-1;i>=0;i--){ let p = sparkParticles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05; graphics.fillStyle(0xffaa00, p.life); graphics.fillCircle(p.x,p.y, 3 * p.life); if(p.life<=0) sparkParticles.splice(i,1); } }
function drawRails(){ graphics.clear(); drawRailSegment(100,300,300,300); drawRailBranch(pathA); drawRailBranch(pathB); let active = switchState==="A"?pathA:pathB; highlightRail(active,0x00ccff); let wrong = correctPath==="A"?pathB:pathA; drawWarning(wrong); }
function drawRailSegment(x1,y1,x2,y2){ drawRailLine(x1,y1,x2,y2); drawSleepers(x1,y1,x2,y2); }
function drawRailBranch(path){ for(let i=1;i<path.length-1;i++){ drawRailSegment(path[i].x,path[i].y,path[i+1].x,path[i+1].y); } }
function drawRailLine(x1,y1,x2,y2){ let dx=x2-x1, dy=y2-y1; let len=Math.sqrt(dx*dx+dy*dy); let nx=-dy/len*4, ny=dx/len*4; graphics.lineStyle(3,0x777777); graphics.beginPath(); graphics.moveTo(x1+nx,y1+ny); graphics.lineTo(x2+nx,y2+ny); graphics.strokePath(); graphics.beginPath(); graphics.moveTo(x1-nx,y1-ny); graphics.lineTo(x2-nx,y2-ny); graphics.strokePath(); }
function drawSleepers(x1,y1,x2,y2){ let dx=x2-x1, dy=y2-y1; let len=Math.sqrt(dx*dx+dy*dy); let steps=Math.floor(len/20); for(let i=0;i<steps;i++){ let t=i/steps; let x=x1+dx*t; let y=y1+dy*t; let nx=-dy/len*6, ny=dx/len*6; graphics.lineStyle(2,0x5c4033); graphics.beginPath(); graphics.moveTo(x-nx,y-ny); graphics.lineTo(x+nx,y+ny); graphics.strokePath(); } }
function highlightRail(path,color){ graphics.lineStyle(5,color,0.8); for(let i=1;i<path.length-1;i++){ graphics.beginPath(); graphics.moveTo(path[i].x,path[i].y); graphics.lineTo(path[i+1].x,path[i+1].y); graphics.strokePath(); } }
function drawWarning(path){ let p = path[2]; let size = 20; graphics.fillStyle(0xffeb3b); graphics.beginPath(); graphics.moveTo(p.x, p.y-size); graphics.lineTo(p.x-size, p.y+size); graphics.lineTo(p.x+size, p.y+size); graphics.closePath(); graphics.fillPath(); graphics.lineStyle(4,0xff0000); graphics.beginPath(); graphics.moveTo(p.x-8,p.y); graphics.lineTo(p.x+8,p.y); graphics.moveTo(p.x,p.y-8); graphics.lineTo(p.x,p.y+8); graphics.strokePath(); }
function setNewCorrectPath(){ correctPath = Math.random()>0.5?"A":"B"; }

function resetTrain(){
  train.x=100;
  train.y=300;
  train.rotation=0;
  currentAngle = 0;
  pathIndex=0;
  currentPath=pathA;
  switchState="A";
  lockedChoice=null;
}

// --- HTML ARAYÜZ YÖNETİMİ ---
function startGame() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById("startScreen").classList.add("hidden");
  gameStarted = true;
  setNewCorrectPath();
}

function triggerGameOver() {
  if(isGameOver) return; 
  isGameOver = true;
  playSound('crash'); 
  
  gameScene.cameras.main.shake(400, 0.02); 
  
  setTimeout(() => {
    document.getElementById("gameOverScreen").classList.remove("hidden");
    document.getElementById("finalScoreDisplay").innerText = "Skor: " + score;
    
    if(score > 0) {
      document.getElementById("scoreInputArea").classList.remove("hidden");
      document.getElementById("justRestartBtn").classList.add("hidden");
      document.getElementById("playerNameInput").value = "";
      
      // Mobilde klavye açıldığında ekran bozulmasın diye minik gecikme ile focus yap
      setTimeout(() => { document.getElementById("playerNameInput").focus(); }, 100);
      
    } else {
      document.getElementById("scoreInputArea").classList.add("hidden");
      document.getElementById("justRestartBtn").classList.remove("hidden");
    }
  }, 400); 
}

function restartGame() {
  document.getElementById("gameOverScreen").classList.add("hidden");
  score = 0;
  isGameOver = false;
  speed = baseSpeed;
  scoreText.setText("Score: 0");
  coin.setVisible(false);
  resetTrain();
  setNewCorrectPath();
}
</script>

</body>
</html>
