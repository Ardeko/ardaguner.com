<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Switch Master</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #gameWrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ui-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }

  .modal-box {
    background: #222;
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    color: white;
    min-width: 300px;
  }

  .modal-box h2 {
    margin-top: 0;
    color: #ff4444;
    font-size: 32px;
    text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
  }

  .modal-box.start h2 {
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
  }

  .modal-box p {
    font-size: 20px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 80%;
    padding: 10px;
    margin-bottom: 15px;
    background: #111;
    border: 1px solid #555;
    color: #00ff88;
    font-size: 16px;
    border-radius: 6px;
    text-align: center;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: #00ff88;
    box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
  }

  button {
    background: #00ff88;
    color: #000;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    margin: 5px;
  }

  button:hover {
    background: #00cc6a;
    transform: scale(1.05);
  }

  #leaderboardUI {
    position: absolute; 
    top: 20px; 
    right: 20px; 
    background: rgba(34, 34, 34, 0.9); 
    border: 2px solid #00ccff; 
    color: white; 
    padding: 15px 25px; 
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 50;
  }
  #leaderboardUI h3 { margin-top: 0; color: #00ccff; text-align: center; }
  #scoreList { padding-left: 20px; margin-bottom: 0; }
  #scoreList li { margin-bottom: 5px; font-size: 16px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="gameWrapper">
  <div id="leaderboardUI">
    <h3>Top 5 Masters</h3>
    <ol id="scoreList">Yükleniyor...</ol>
  </div>

  <div id="startScreen" class="ui-screen">
    <div class="modal-box start">
      <h2>🚂 Switch Master</h2>
      <p>Rayları değiştir, treni kurtar!</p>
      <button onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div id="gameOverScreen" class="ui-screen hidden">
    <div class="modal-box">
      <h2>CRASH!</h2>
      <p id="finalScoreDisplay">Score: 0</p>
      
      <div id="scoreInputArea" class="hidden">
        <input type="text" id="playerNameInput" placeholder="İsmini gir..." maxlength="12" autocomplete="off" />
        <br>
        <button onclick="submitScoreAndRestart()">Kaydet ve Tekrar Oyna</button>
      </div>

      <button id="justRestartBtn" onclick="restartGame()">Tekrar Oyna</button>
    </div>
  </div>

</div>

<script>
// --- KODLA ÜRETİLEN RETRO SES EFEKTLERİ ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  const now = audioCtx.currentTime;

  if (type === 'switch') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'score') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.setValueAtTime(800, now + 0.1);
    gainNode.gain.setValueAtTime(0.1, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'coin') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.setValueAtTime(1600, now + 0.1);
    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  }
}

// --- FIREBASE & LEADERBOARD ---
const FIREBASE_URL = "https://switch-master-687ff-default-rtdb.europe-west1.firebasedatabase.app/scores.json";

function loadScores() {
  document.getElementById("scoreList").innerHTML = "Yükleniyor...";
  fetch(FIREBASE_URL)
    .then(res => res.json())
    .then(data => {
      if (!data) {
        document.getElementById("scoreList").innerHTML = "Henüz skor yok!";
        return;
      }
      let scoresArray = Object.values(data);
      scoresArray.sort((a, b) => b.score - a.score);
      let top5 = scoresArray.slice(0, 5);
      
      let listHTML = "";
      top5.forEach(entry => {
        listHTML += `<li><b>${entry.name}</b>: ${entry.score}</li>`;
      });
      document.getElementById("scoreList").innerHTML = listHTML;
    }).catch(err => console.error(err));
}

loadScores();

function submitScoreAndRestart() {
  const name = document.getElementById("playerNameInput").value.trim();
  if (name !== "") {
    fetch(FIREBASE_URL, {
      method: "POST",
      body: JSON.stringify({ name: name, score: score })
    }).then(() => {
      loadScores();
      restartGame();
    }).catch(err => console.error(err));
  } else {
    restartGame();
  }
}

// --- PHASER OYUN KODLARI ---
const config = {
  type: Phaser.AUTO,
  width: 800, 
  height: 600, 
  backgroundColor: "#87CEEB", // Gündüz rengiyle başlar
  parent: 'gameWrapper', 
  scene: { create, update },
  scale: {
    mode: Phaser.Scale.FIT, 
    autoCenter: Phaser.Scale.CENTER_BOTH 
  }
};

const game = new Phaser.Game(config);

let train, graphics, scoreText;
let switchLever, headlight, coin;
let currentPath, pathIndex = 0;
let baseSpeed = 2.5;
let speed = baseSpeed;
let maxSpeed = 10;
let switchState = "A";
let correctPath = "A";
let lockedChoice = null;

let score = 0;
let isGameOver = false;
let gameStarted = false;
let pulse = 0;
let smokeParticles = [];
let sparkParticles = [];
let currentAngle = 0;

const pathA = [ {x:100,y:300},{x:300,y:300},{x:500,y:200},{x:700,y:200} ];
const pathB = [ {x:100,y:300},{x:300,y:300},{x:500,y:400},{x:700,y:400} ];

let gameScene; // Kamera efektleri için referans tutucu

function create(){
  gameScene = this;
  graphics = this.add.graphics();
  
  // Bonus Altın (Coin)
  coin = this.add.container(0, 0);
  let coinBody = this.add.circle(0, 0, 12, 0xffd700);
  let coinBorder = this.add.circle(0, 0, 12).setStrokeStyle(2, 0xb8860b);
  let coinText = this.add.text(-5, -8, "$", {fontSize: '16px', color: '#000', fontStyle: 'bold'});
  coin.add([coinBody, coinBorder, coinText]);
  coin.setVisible(false);

  train = this.add.container(100,300);

  // Far Işığı (Sadece gece yanacak)
  headlight = this.add.graphics();
  headlight.fillStyle(0xffffff, 0.15);
  headlight.fillTriangle(10, 0, 250, -80, 250, 80);
  headlight.setVisible(false);

  let body = this.add.rectangle(0,0,60,24,0x2e7d32);
  let cabin = this.add.rectangle(10,-14,22,16,0x388e3c);
  let window = this.add.rectangle(10,-14,10,8,0xb3e5fc);
  let front = this.add.rectangle(-25,0,10,18,0x1b5e20);
  let bumper = this.add.rectangle(-30,0,6,10,0xd32f2f);
  let chimney = this.add.rectangle(-10,-18,8,10,0x424242);

  train.add([headlight, body,cabin,window,front,bumper,chimney]);

  scoreText = this.add.text(20,20,"Score: 0",{fontSize:"26px",fill:"#fff", fontStyle:"bold", stroke: '#000', strokeThickness: 4});

  switchLever = this.add.rectangle(300,280,10,40,0xaaaaaa);

  this.input.on("pointerdown", ()=>{
    if(!gameStarted || isGameOver) return; 

    playSound('switch');
    spawnSparks(); // Makas değişiminde kıvılcımlar
    this.cameras.main.shake(100, 0.005); // Hafif kamera sarsıntısı

    switchState = switchState==="A"?"B":"A";

    this.tweens.add({
      targets:switchLever,
      scaleY:0.6,
      duration:60,
      yoyo:true
    });
  });

  currentPath = pathA;
}

function update(){
  if(!gameStarted || isGameOver) return;

  pulse += 0.05;
  
  // Gece - Gündüz ve Hız Döngüsü
  if(score < 5) {
      gameScene.cameras.main.setBackgroundColor('#87CEEB'); // Gündüz
      headlight.setVisible(false);
  } else if (score < 10) {
      gameScene.cameras.main.setBackgroundColor('#fc7b03'); // Gün batımı
      headlight.setVisible(false);
  } else {
      gameScene.cameras.main.setBackgroundColor('#111122'); // Gece
      headlight.setVisible(true); // Farlar açılır
  }

  // Altın Animasyonu ve Toplama Mantığı
  if(coin.visible) {
    coin.scale = 1 + Math.sin(pulse * 4) * 0.1; // Parlama/Nabız efekti
    let cx = coin.x - train.x;
    let cy = coin.y - train.y;
    if(Math.sqrt(cx*cx + cy*cy) < 25) { // Çarpışma algılama
        coin.setVisible(false);
        score += 3; // Altın bonusu
        scoreText.setText("Score: " + score);
        playSound('coin');
        
        // Skoru yeşil parlatma efekti
        gameScene.tweens.add({
            targets: scoreText,
            scale: 1.5,
            duration: 100,
            yoyo: true
        });
    }
  }

  drawRails();
  updateSmoke();
  updateSparks();

  let target = currentPath[pathIndex];
  let dx = target.x - train.x;
  let dy = target.y - train.y;
  let dist = Math.sqrt(dx*dx + dy*dy);
  let step = Math.min(speed, dist);

  if(dist <= step){
    train.x = target.x;
    train.y = target.y;
    pathIndex++;

    if(pathIndex === 2){
      lockedChoice = switchState;
      currentPath = lockedChoice === "A" ? pathA : pathB;
    }

    if(pathIndex >= currentPath.length){
      if(lockedChoice !== correctPath){
        triggerGameOver();
      } else {
        score++;
        scoreText.setText("Score: " + score);
        playSound('score'); 

        speed += 0.3;
        if(speed > maxSpeed) speed = maxSpeed;

        resetTrain();
        setNewCorrectPath();
        
        // %40 ihtimalle yola altın koy
        if(Math.random() > 0.6) {
            let activePath = correctPath === "A" ? pathA : pathB;
            coin.x = activePath[2].x;
            coin.y = activePath[2].y;
            coin.setVisible(true);
        } else {
            coin.setVisible(false);
        }
      }
    }
  } else {
    train.x += (dx/dist) * step;
    train.y += (dy/dist) * step;

    let targetAngle = Math.atan2(dy, dx);
    currentAngle += (targetAngle - currentAngle) * 0.15;
    train.rotation = currentAngle;

    spawnSmoke();
  }
}

// Görsel Fonksiyonlar ve Partiküller
function spawnSmoke(){ 
    if(Math.random() > 0.5) return;
    smokeParticles.push({ x: train.x - 10, y: train.y - 20, alpha: 1, size: Phaser.Math.Between(4,8) }); 
}
function updateSmoke(){ 
    for(let i=smokeParticles.length-1;i>=0;i--){ 
        let p = smokeParticles[i]; 
        p.y -= 0.5; p.alpha -= 0.015; 
        graphics.fillStyle(0xdddddd, p.alpha); 
        graphics.fillCircle(p.x,p.y,p.size); 
        if(p.alpha<=0) smokeParticles.splice(i,1); 
    } 
}
function spawnSparks() {
    for(let i=0; i<8; i++) {
        sparkParticles.push({
            x: train.x, y: train.y + 10,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1.0
        });
    }
}
function updateSparks() {
    for(let i=sparkParticles.length-1;i>=0;i--){ 
        let p = sparkParticles[i]; 
        p.x += p.vx; p.y += p.vy; p.life -= 0.05; 
        graphics.fillStyle(0xffaa00, p.life); 
        graphics.fillCircle(p.x,p.y, 3 * p.life); 
        if(p.life<=0) sparkParticles.splice(i,1); 
    } 
}

function drawRails(){ 
    graphics.clear(); 
    drawRailSegment(100,300,300,300); 
    drawRailBranch(pathA); 
    drawRailBranch(pathB); 
    let active = switchState==="A"?pathA:pathB; 
    highlightRail(active,0x00ccff); 
    let wrong = correctPath==="A"?pathB:pathA; 
    drawWarning(wrong); 
}
function drawRailSegment(x1,y1,x2,y2){ drawRailLine(x1,y1,x2,y2); drawSleepers(x1,y1,x2,y2); }
function drawRailBranch(path){ for(let i=1;i<path.length-1;i++){ drawRailSegment(path[i].x,path[i].y,path[i+1].x,path[i+1].y); } }
function drawRailLine(x1,y1,x2,y2){ let dx=x2-x1, dy=y2-y1; let len=Math.sqrt(dx*dx+dy*dy); let nx=-dy/len*4, ny=dx/len*4; graphics.lineStyle(3,0x777777); graphics.beginPath(); graphics.moveTo(x1+nx,y1+ny); graphics.lineTo(x2+nx,y2+ny); graphics.strokePath(); graphics.beginPath(); graphics.moveTo(x1-nx,y1-ny); graphics.lineTo(x2-nx,y2-ny); graphics.strokePath(); }
function drawSleepers(x1,y1,x2,y2){ let dx=x2-x1, dy=y2-y1; let len=Math.sqrt(dx*dx+dy*dy); let steps=Math.floor(len/20); for(let i=0;i<steps;i++){ let t=i/steps; let x=x1+dx*t; let y=y1+dy*t; let nx=-dy/len*6, ny=dx/len*6; graphics.lineStyle(2,0x5c4033); graphics.beginPath(); graphics.moveTo(x-nx,y-ny); graphics.lineTo(x+nx,y+ny); graphics.strokePath(); } }
function highlightRail(path,color){ graphics.lineStyle(5,color,0.8); for(let i=1;i<path.length-1;i++){ graphics.beginPath(); graphics.moveTo(path[i].x,path[i].y); graphics.lineTo(path[i+1].x,path[i+1].y); graphics.strokePath(); } }
function drawWarning(path){ let p = path[2]; let size = 20; graphics.fillStyle(0xffeb3b); graphics.beginPath(); graphics.moveTo(p.x, p.y-size); graphics.lineTo(p.x-size, p.y+size); graphics.lineTo(p.x+size, p.y+size); graphics.closePath(); graphics.fillPath(); graphics.lineStyle(4,0xff0000); graphics.beginPath(); graphics.moveTo(p.x-8,p.y); graphics.lineTo(p.x+8,p.y); graphics.moveTo(p.x,p.y-8); graphics.lineTo(p.x,p.y+8); graphics.strokePath(); }
function setNewCorrectPath(){ correctPath = Math.random()>0.5?"A":"B"; }

function resetTrain(){
  train.x=100;
  train.y=300;
  train.rotation=0;
  currentAngle = 0;
  pathIndex=0;
  currentPath=pathA;
  switchState="A";
  lockedChoice=null;
}

// --- HTML ARAYÜZ YÖNETİMİ ---
function startGame() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  document.getElementById("startScreen").classList.add("hidden");
  gameStarted = true;
  setNewCorrectPath();
}

function triggerGameOver() {
  if(isGameOver) return; 
  isGameOver = true;
  playSound('crash'); 
  
  gameScene.cameras.main.shake(400, 0.02); // Kaza anında şiddetli sarsıntı
  
  setTimeout(() => {
    document.getElementById("gameOverScreen").classList.remove("hidden");
    document.getElementById("finalScoreDisplay").innerText = "Skor: " + score;
    
    if(score > 0) {
      document.getElementById("scoreInputArea").classList.remove("hidden");
      document.getElementById("justRestartBtn").classList.add("hidden");
      document.getElementById("playerNameInput").value = "";
      document.getElementById("playerNameInput").focus();
    } else {
      document.getElementById("scoreInputArea").classList.add("hidden");
      document.getElementById("justRestartBtn").classList.remove("hidden");
    }
  }, 400); // Sarsıntı bitene kadar bekle
}

function restartGame() {
  document.getElementById("gameOverScreen").classList.add("hidden");
  score = 0;
  isGameOver = false;
  speed = baseSpeed;
  scoreText.setText("Score: 0");
  coin.setVisible(false);
  resetTrain();
  setNewCorrectPath();
}
</script>

</body>
</html>
